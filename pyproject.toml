[project]
name = "audioai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # onnxruntime-gpu 没有 macOS 轮子，mac 上必须走 cpu extra；
    # 分离用的 torch 那侧照样吃 MPS，onnx 那侧走 CoreML
    "audio-separator[gpu]>=0.41.1; sys_platform != 'darwin'",
    "audio-separator[cpu]>=0.41.1; sys_platform == 'darwin'",
    "customtkinter>=5.2.2",
    "packaging>=26.0",
    "pyinstaller>=6.18.0",
    "torch>=2.10.0",
]

[tool.uv.sources]
# CUDA 轮子只在 Windows/Linux 上装，mac 用 PyPI 官方的 arm64 轮子（自带 MPS）
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
